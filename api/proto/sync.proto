syntax = "proto3";

package aether.api;

option go_package = "github.com/aether/sync/api/proto;proto";

import "api/proto/common.proto";
import "google/protobuf/timestamp.proto";

// Sync servisi
service SyncService {
  // Dosya senkronize et
  rpc SyncFile(SyncFileRequest) returns (SyncFileResponse);
  
  // Klasör senkronize et (tüm dosyaları senkronize eder)
  rpc SyncFolder(SyncFolderRequest) returns (SyncFolderResponse);
  
  // Senkronizasyon durumunu getir
  rpc GetSyncStatus(GetSyncStatusRequest) returns (SyncStatusResponse);
  
  // Senkronizasyonu duraklat/devam ettir
  rpc PauseSync(PauseSyncRequest) returns (Status);
  rpc ResumeSync(ResumeSyncRequest) returns (Status);
  
  // Real-time senkronizasyon olaylarını dinle (streaming)
  rpc WatchSyncEvents(WatchSyncEventsRequest) returns (stream SyncEvent);
  
  // Dosyayı peer'dan talep et (indirme)
  rpc RequestFileFromPeer(RequestFileFromPeerRequest) returns (RequestFileFromPeerResponse);
  
  // Transfer durumunu getir
  rpc GetTransferStatus(GetTransferStatusRequest) returns (TransferStatusResponse);
  
  // Transfer progress'ini dinle (streaming)
  rpc WatchTransferProgress(WatchTransferProgressRequest) returns (stream TransferProgressUpdate);
}

// Mesajlar

message SyncFileRequest {
  string file_id = 1;
  repeated string target_peer_ids = 2;
}

message SyncFileResponse {
  Status status = 1;
  SyncProgress progress = 2;
}

message SyncFolderRequest {
  string folder_id = 1;
  repeated string target_peer_ids = 2;
}

message SyncFolderResponse {
  Status status = 1;
  SyncProgress progress = 2;
  int32 total_files = 3;
  int32 synced_files = 4;
}

message GetSyncStatusRequest {
  string folder_id = 1;
}

message SyncStatusResponse {
  Status status = 1;
  SyncStatus sync_status = 2;
}

message SyncStatus {
  string folder_id = 1;
  int32 total_files = 2;
  int32 synced_files = 3;
  int32 pending_files = 4;
  int64 total_size = 5;
  int64 synced_size = 6;
  google.protobuf.Timestamp last_sync_time = 7;
  bool is_syncing = 8;
  string current_operation = 9;
}

message SyncProgress {
  int64 bytes_transferred = 1;
  int64 total_bytes = 2;
  float percentage = 3;
  int64 speed_bps = 4;
  int64 eta_seconds = 5;
}

message PauseSyncRequest {
  string folder_id = 1;
}

message ResumeSyncRequest {
  string folder_id = 1;
}

message WatchSyncEventsRequest {
  string folder_id = 1;
}

message SyncEvent {
  enum EventType {
    EVENT_TYPE_UNSPECIFIED = 0;
    EVENT_TYPE_FILE_ADDED = 1;
    EVENT_TYPE_FILE_MODIFIED = 2;
    EVENT_TYPE_FILE_DELETED = 3;
    EVENT_TYPE_SYNC_STARTED = 4;
    EVENT_TYPE_SYNC_COMPLETED = 5;
    EVENT_TYPE_SYNC_FAILED = 6;
  }
  
  EventType event_type = 1;
  string file_id = 2;
  string file_path = 3;
  google.protobuf.Timestamp timestamp = 4;
  string message = 5;
}

// Transfer mesajları
message RequestFileFromPeerRequest {
  string file_id = 1;
  string peer_id = 2;
}

message RequestFileFromPeerResponse {
  Status status = 1;
  string transfer_id = 2;
}

message GetTransferStatusRequest {
  string file_id = 1;
}

message TransferStatusResponse {
  Status status = 1;
  TransferStatus transfer_status = 2;
}

message TransferStatus {
  string file_id = 1;
  string file_name = 2;
  string peer_id = 3;
  string peer_name = 4;
  int32 total_chunks = 5;
  int32 completed_chunks = 6;
  int64 total_bytes = 7;
  int64 transferred_bytes = 8;
  bool is_complete = 9;
  bool is_failed = 10;
  string error_message = 11;
  google.protobuf.Timestamp start_time = 12;
  google.protobuf.Timestamp end_time = 13;
}

message WatchTransferProgressRequest {
  string file_id = 1;
}

message TransferProgressUpdate {
  string file_id = 1;
  int32 completed_chunks = 2;
  int32 total_chunks = 3;
  int64 transferred_bytes = 4;
  int64 total_bytes = 5;
  bool is_complete = 6;
  bool is_failed = 7;
  string error_message = 8;
}





