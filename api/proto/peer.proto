syntax = "proto3";

package aether.api;

option go_package = "github.com/aether/sync/api/proto;proto";

import "api/proto/common.proto";
import "google/protobuf/timestamp.proto";

// Peer servisi
service PeerService {
  // Peer'ları keşfet
  rpc DiscoverPeers(DiscoverPeersRequest) returns (DiscoverPeersResponse);
  
  // Peer'a bağlan
  rpc ConnectToPeer(ConnectToPeerRequest) returns (Status);
  
  // Peer bağlantısını kes
  rpc DisconnectFromPeer(DisconnectFromPeerRequest) returns (Status);
  
  // Tüm peer'ları listele
  rpc ListPeers(ListPeersRequest) returns (ListPeersResponse);
  
  // Peer detay bilgisi getir
  rpc GetPeerInfo(GetPeerInfoRequest) returns (PeerInfoResponse);
  
  // Peer'i güvenilir yap
  rpc TrustPeer(TrustPeerRequest) returns (Status);
  
  // Peer'i güvenilmez yap
  rpc UntrustPeer(UntrustPeerRequest) returns (Status);
  
  // Peer'ı kaldır
  rpc RemovePeer(RemovePeerRequest) returns (Status);
  
  // Bekleyen bağlantı isteklerini al
  rpc GetPendingConnections(GetPendingConnectionsRequest) returns (GetPendingConnectionsResponse);
  
  // Bağlantı isteğini onayla
  rpc AcceptConnection(AcceptConnectionRequest) returns (Status);
  
  // Bağlantı isteğini reddet
  rpc RejectConnection(RejectConnectionRequest) returns (Status);
  
  // Invitation code oluştur (WAN için)
  rpc CreateInvitation(CreateInvitationRequest) returns (CreateInvitationResponse);
  
  // Invitation code ile peer ekle (WAN için)
  rpc AddPeerByInvitation(AddPeerByInvitationRequest) returns (Status);
  
  // Manuel WAN peer ekle (invitation code olmadan)
  rpc AddWANPeer(AddWANPeerRequest) returns (Status);
  
  // SDP exchange (WAN WebRTC bağlantısı için)
  rpc ExchangeSDP(ExchangeSDPRequest) returns (ExchangeSDPResponse);
}

// Mesajlar

message Peer {
  string device_id = 1;
  string name = 2;
  repeated string known_addresses = 3;
  bool is_trusted = 4;
  google.protobuf.Timestamp last_seen = 5;
  PeerStatus status = 6;
  string public_key = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  
  // WAN bilgileri (yeni)
  string public_ip = 10;           // Public IP adresi (STUN'dan)
  string nat_type = 11;            // NAT tipi (full_cone, symmetric, vb.)
  bool wan_supported = 12;         // WAN transport destekleniyor mu?
  repeated string ice_candidates = 13; // ICE candidates (SDP format)
}

message DiscoverPeersRequest {
  bool lan_only = 1;
  bool wan_only = 2;  // YENİ: Sadece WAN peer'larını keşfet
}

message DiscoverPeersResponse {
  Status status = 1;
  repeated Peer peers = 2;
}

message ConnectToPeerRequest {
  string peer_id = 1;
  string transport_type = 2;  // YENİ: "lan", "wan", "auto" (auto = otomatik seç)
}

message DisconnectFromPeerRequest {
  string peer_id = 1;
}

message ListPeersRequest {
  bool online_only = 1;
  bool trusted_only = 2;
  PaginationRequest pagination = 3;
}

message ListPeersResponse {
  repeated Peer peers = 1;
  PaginationResponse pagination = 2;
}

message GetPeerInfoRequest {
  string peer_id = 1;
}

message PeerInfoResponse {
  Status status = 1;
  Peer peer = 2;
  repeated string shared_folders = 3;
  int32 shared_files = 4;
  int32 total_chunks = 5;
  google.protobuf.Timestamp last_activity = 6;
  string connection_type = 7;  // "lan" veya "wan"
  int64 latency_ms = 8;
  
  // WAN connection bilgileri (yeni)
  WANConnectionInfo wan_info = 9;
}

// WAN bağlantı bilgileri
message WANConnectionInfo {
  string public_ip = 1;
  string nat_type = 2;
  repeated string stun_servers = 3;
  bool turn_available = 4;
  int64 connection_establishment_time_ms = 5;  // Bağlantı kurulma süresi
}

message TrustPeerRequest {
  string peer_id = 1;
}

message UntrustPeerRequest {
  string peer_id = 1;
}

message RemovePeerRequest {
  string peer_id = 1;
}

// Bağlantı istekleri için mesajlar
message GetPendingConnectionsRequest {}

message GetPendingConnectionsResponse {
  Status status = 1;
  repeated PendingConnection pending_connections = 2;
}

message PendingConnection {
  string device_id = 1;
  string device_name = 2;
  int64 timestamp = 3;
}

message AcceptConnectionRequest {
  string device_id = 1;
}

message RejectConnectionRequest {
  string device_id = 1;
  string reason = 2;
}

// Invitation code mesajları (WAN için)
message CreateInvitationRequest {
  int32 expiry_hours = 1;  // Geçerlilik süresi (saat), varsayılan: 24
}

message CreateInvitationResponse {
  Status status = 1;
  string invitation_code = 2;  // Base64 encoded encrypted code
  string invitation_link = 3;  // aether://invite?code=...
  string qr_code_image = 4;    // Base64 encoded QR code image (PNG) - opsiyonel
  int64 expires_at = 5;        // Unix timestamp
}

message AddPeerByInvitationRequest {
  string invitation_code = 1;  // Base64 encoded encrypted code
}

message AddWANPeerRequest {
  string peer_id = 1;           // Device ID
  string peer_name = 2;         // Device name (opsiyonel)
  string public_ip = 3;         // Public IP (opsiyonel)
  repeated string ice_candidates = 4;  // ICE candidates (JSON string array veya SDP format)
}

// SDP exchange mesajları (WAN WebRTC için)
message ExchangeSDPRequest {
  string peer_id = 1;    // Gönderen peer ID (doğrulama için)
  string sdp_type = 2;   // "offer" veya "answer"
  string sdp = 3;        // SDP string
}

message ExchangeSDPResponse {
  Status status = 1;
  string sdp_type = 2;   // "answer" (eğer request "offer" ise) veya "offer" (eğer request "answer" ise)
  string sdp = 3;        // SDP string
}

// P2P bağlantı istek mesajları (binary protokol için)
message ConnectionRequest {
  string device_id = 1;
  string device_name = 2;
  int64 timestamp = 3;
}

message ConnectionResponse {
  bool accepted = 1;
  string message = 2;
  string device_id = 3;
}





