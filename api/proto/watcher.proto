syntax = "proto3";

package aether.api;

option go_package = "github.com/aether/sync/api/proto;proto";

import "api/proto/common.proto";

// Watcher servisi - dosya izleme
service WatcherService {
  // Klasör izlemeye başla
  rpc StartWatching(StartWatchingRequest) returns (Status);
  
  // Klasör izlemeyi durdur
  rpc StopWatching(StopWatchingRequest) returns (Status);
  
  // İzlenen klasörleri listele
  rpc ListWatchedFolders(ListWatchedFoldersRequest) returns (ListWatchedFoldersResponse);
  
  // Watch durumunu al
  rpc GetWatchStatus(GetWatchStatusRequest) returns (WatchStatusResponse);
  
  // Dosya değişikliklerini izle (streaming)
  rpc WatchFileEvents(WatchFileEventsRequest) returns (stream FileEvent);
}

// Mesajlar

message StartWatchingRequest {
  string folder_id = 1;
}

message StopWatchingRequest {
  string folder_id = 1;
}

message ListWatchedFoldersRequest {
  // Boş - tüm izlenen klasörleri döner
}

message ListWatchedFoldersResponse {
  repeated string folder_ids = 1;
  Status status = 2;
}

message GetWatchStatusRequest {
  string folder_id = 1;
}

message WatchStatusResponse {
  bool is_watching = 1;
  string folder_id = 2;
  string folder_path = 3;
  Status status = 4;
}

message WatchFileEventsRequest {
  // Boş - tüm dosya değişikliklerini dinler
}

message FileEvent {
  enum EventType {
    EVENT_TYPE_UNSPECIFIED = 0;
    EVENT_TYPE_CREATE = 1;     // Dosya oluşturuldu
    EVENT_TYPE_MODIFY = 2;     // Dosya değiştirildi
    EVENT_TYPE_DELETE = 3;     // Dosya silindi
    EVENT_TYPE_RENAME = 4;     // Dosya yeniden adlandırıldı
  }
  
  EventType event_type = 1;
  string folder_id = 2;
  string file_id = 3;
  string file_path = 4;         // Relative path
  string old_path = 5;          // Rename için eski path
  int64 timestamp = 6;          // Unix timestamp (milliseconds)
}

